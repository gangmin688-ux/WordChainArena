<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끄글 - 끝말잇기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 메인 메뉴 -->
  <section id="screen-menu" class="screen active">
    <h1 class="logo">끄 글</h1>
    <div class="subtitle">끝말잇기 대전</div>

    <div class="card" style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn primary" data-go="local-setup">📱 로컬 대전 (한 기기, 1:1 이상)</button>
      <button class="btn accent2" data-go="online-create">🌐 온라인 방 만들기</button>
      <button class="btn ghost" data-go="online-join">🔑 온라인 방 참가</button>
    </div>
    <div class="card small">
      <b>로컬 대전</b>: 같은 기기를 돌려가며 플레이 (2~6명)<br>
      <b>온라인</b>: 각자 기기에서 방 코드로 접속해 실시간 대전
    </div>
  </section>

  <!-- 로컬 설정 -->
  <section id="screen-local-setup" class="screen">
    <h1 class="logo" style="font-size:24px;">로컬 대전 설정</h1>
    <div class="card">
      <div class="field">
        <label>인원 수 (2~6명)</label>
        <input type="number" id="local-count" min="2" max="6" value="2">
      </div>
      <div id="local-name-fields"></div>
      <button class="btn ghost" id="local-name-refresh">인원 수 적용</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" data-go="menu">뒤로</button>
      <button class="btn primary" id="local-start-btn">게임 시작</button>
    </div>
  </section>

  <!-- 온라인 방 만들기 -->
  <section id="screen-online-create" class="screen">
    <h1 class="logo" style="font-size:24px;">방 만들기</h1>
    <div class="card">
      <label>닉네임</label>
      <input type="text" id="create-name" maxlength="10" placeholder="닉네임 입력">
      <button class="btn primary" id="create-room-btn">방 만들기</button>
      <div class="error-msg" id="create-error"></div>
    </div>
    <button class="btn ghost" data-go="menu">뒤로</button>
  </section>

  <!-- 온라인 방 참가 -->
  <section id="screen-online-join" class="screen">
    <h1 class="logo" style="font-size:24px;">방 참가</h1>
    <div class="card">
      <label>닉네임</label>
      <input type="text" id="join-name" maxlength="10" placeholder="닉네임 입력">
      <label>방 코드 (4자리)</label>
      <input type="text" id="join-code" maxlength="4" placeholder="예: 1234">
      <button class="btn primary" id="join-room-btn">참가하기</button>
      <div class="error-msg" id="join-error"></div>
    </div>
    <button class="btn ghost" data-go="menu">뒤로</button>
  </section>

  <!-- 온라인 대기실 -->
  <section id="screen-lobby" class="screen">
    <h1 class="logo" style="font-size:24px;">대기실</h1>
    <div class="card" style="text-align:center;">
      <div class="small">방 코드</div>
      <div class="room-code" id="lobby-code">----</div>
      <div class="small">친구에게 이 코드를 알려주세요</div>
    </div>
    <div class="card">
      <label>참가자 (<span id="lobby-count">0</span>명)</label>
      <ul class="player-list" id="lobby-players"></ul>
    </div>
    <button class="btn primary" id="lobby-start-btn" style="display:none;">게임 시작</button>
    <div class="center-msg" id="lobby-wait-msg">호스트가 게임을 시작할 때까지 기다려주세요...</div>
    <button class="btn ghost" id="lobby-leave-btn">나가기</button>
  </section>

  <!-- 게임 화면 -->
  <section id="screen-game" class="screen">
    <div class="card">
      <ul class="player-list" id="game-players"></ul>
    </div>

    <div class="syllable-box">
      <div class="req">이 글자로 시작하는 단어를 입력하세요</div>
      <div class="letter" id="game-syllable">-</div>
    </div>

    <div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>
    <div class="turn-status" id="turn-status">준비 중...</div>

    <div class="card">
      <div class="row-gap">
        <input type="text" id="word-input" placeholder="단어 입력" style="margin-bottom:0;">
        <button class="btn primary" id="submit-word-btn" style="width:auto; padding:12px 18px;">입력</button>
      </div>
      <div class="error-msg" id="word-error"></div>
      <div class="btn-row">
        <button class="btn ghost" id="hint-btn">💡 힌트</button>
        <button class="btn danger" id="giveup-btn">포기</button>
      </div>
    </div>

    <div class="card">
      <label>기록</label>
      <div class="history" id="game-history"></div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="screen-result" class="screen">
    <h1 class="logo" style="font-size:24px;">게임 종료</h1>
    <div class="card">
      <div class="small" style="text-align:center;">승자</div>
      <div class="winner-name" id="result-winner">-</div>
    </div>
    <div class="card">
      <label>전체 기록</label>
      <div class="history" id="result-history" style="max-height:260px; flex-direction:column;"></div>
    </div>
    <button class="btn primary" data-go="menu">메인으로</button>
  </section>

  <div class="footer-note">끄글 · 로컬 데이터 기반 단어 사전 · Firebase 실시간 대전</div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
